<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemonade Apps — Flatpak repository</title>
  <meta name="description" content="Signed Flatpak repository for Lemonade desktop apps. One-click install per app, or add the whole repository.">
  <meta property="og:title" content="Lemonade Apps — Flatpak repository">
  <meta property="og:description" content="Signed Flatpak repository for Lemonade desktop apps.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #fcd846;
      --accent-ink: #1a1604;
      --ink: #2d2f2f;
      --muted: #6b6f70;
      --bg-top: #ffffff;
      --bg-bottom: #fff9c4;
      --card: rgba(255, 255, 255, 0.55);
      --card-border: rgba(45, 47, 47, 0.08);
      --line: rgba(45, 47, 47, 0.1);
      --code-bg: #f3f3f3;
      --code-ink: #474747;
      --ok: #1f9d6b;
      --shadow: 0 12px 48px rgba(45, 47, 47, 0.08);
      --maxw: 920px;
      --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
      --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      --mono: Consolas, Monaco, "Courier New", ui-monospace, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #fcd846;
        --accent-ink: #1a1604;
        --ink: #f0f2f2;
        --muted: #9ba1a2;
        --bg-top: #0a0b07;
        --bg-bottom: #24220b;
        --card: rgba(22, 23, 19, 0.65);
        --card-border: rgba(255, 255, 255, 0.08);
        --line: rgba(255, 255, 255, 0.1);
        --code-bg: #1c1d17;
        --code-ink: #d4d8d8;
        --shadow: 0 16px 56px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(var(--bg-top) 0, var(--bg-top) 22%, var(--bg-bottom) 100%) no-repeat;
      background-attachment: fixed;
      padding: 0 20px 64px;
      transition: color 0.3s ease, background 0.3s ease;
    }
    a { color: var(--ink); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: var(--maxw); margin: 0 auto; }

    header.nav { display: flex; align-items: center; gap: 16px; height: 72px; }
    .brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
    .brand .mark { font-size: 1.35rem; line-height: 1; }
    .nav .spacer { margin-left: auto; }
    .nav .ext { font-size: 0.9rem; font-weight: 600; color: var(--muted); }

    .hero { padding: 40px 0 8px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.8rem; font-weight: 700; color: var(--muted);
      background: var(--card); border: 1px solid var(--card-border);
      padding: 6px 13px; border-radius: 9999px; margin-bottom: 22px;
      box-shadow: var(--shadow);
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }
    .eyebrow .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }
    .hero h1 {
      font-family: var(--display); font-weight: 800;
      font-size: clamp(34px, 6vw, 54px); line-height: 1.04; letter-spacing: -0.035em;
      margin-bottom: 16px;
    }
    .hl { color: var(--accent); }
    .hero .lede { font-size: 1.18rem; color: var(--muted); max-width: 620px; }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.82rem; font-weight: 600; color: var(--muted);
      background: var(--card); border: 1px solid var(--card-border);
      padding: 7px 13px; border-radius: 9999px;
    }
    .badge code { font-family: var(--mono); font-size: 0.8rem; color: var(--ink); }
    .badge.signed { color: var(--ok); border-color: rgba(31, 157, 107, 0.3); }
    .badge .check { width: 14px; height: 14px; }

    section { padding: 30px 0 6px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .sec-head h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .sec-head .hint { color: var(--muted); font-size: 0.9rem; }

    .card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 22px; padding: 24px; box-shadow: var(--shadow);
      backdrop-filter: blur(8px); min-width: 0;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 56px rgba(45, 47, 47, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      .card:hover {
        box-shadow: 0 16px 56px rgba(0, 0, 0, 0.55);
      }
    }
    .card + .card { margin-top: 18px; }

    .step { display: grid; gap: 9px; }
    .step + .step { margin-top: 18px; }
    .step .label { display: flex; align-items: center; gap: 9px; font-size: 0.92rem; font-weight: 700; }
    .step .label .n {
      width: 21px; height: 21px; border-radius: 50%; flex: none;
      background: var(--accent); color: var(--accent-ink);
      font-size: 0.74rem; font-weight: 800; display: grid; place-items: center;
    }
    .note { font-size: 0.86rem; color: var(--muted); }
    .note code { font-family: var(--mono); background: var(--code-bg); padding: 2px 6px; border-radius: 6px; color: var(--code-ink); }

    .code {
      position: relative; background: var(--code-bg);
      border-radius: 16px 16px 4px 16px; padding: 15px 52px 15px 16px;
      overflow-x: auto; font-family: var(--mono); font-size: 0.84rem; line-height: 1.6; color: var(--code-ink);
    }
    .code code { white-space: pre-wrap; overflow-wrap: anywhere; }
    .copy {
      position: absolute; top: 9px; right: 9px;
      font-family: var(--font); font-size: 0.74rem; font-weight: 700; cursor: pointer;
      color: var(--muted); background: var(--bg-top); border: 1px solid var(--line);
      border-radius: 8px; padding: 5px 9px; transition: color 0.15s, border-color 0.15s, background-color 0.15s;
    }
    .copy:hover { color: var(--ink); border-color: var(--muted); }
    .copy.ok {
      color: var(--ok);
      border-color: rgba(31, 157, 107, 0.4);
      background: rgba(31, 157, 107, 0.05);
    }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-weight: 700; font-size: 0.88rem; cursor: pointer;
      padding: 10px 18px; border-radius: 9999px; border: 1px solid transparent;
      transition: filter 0.15s, border-color 0.15s, color 0.15s, transform 0.1s ease;
    }
    .btn:hover { text-decoration: none; }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { filter: brightness(0.96); }
    .btn.ghost { background: var(--card); border-color: var(--card-border); color: var(--ink); }
    .btn.ghost:hover { border-color: var(--muted); }
    
    .btn:focus-visible, .copy:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .setup-actions { margin-top: 18px; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .app-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .app-icon {
      width: 54px; height: 54px; border-radius: 14px; flex: none; overflow: hidden;
      display: grid; place-items: center; font-size: 28px; line-height: 1;
      background: var(--bg-top) center / contain no-repeat; border: 1px solid var(--card-border);
    }
    .app-name { font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
    .app-id { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); word-break: break-all; }
    .app-head > div { min-width: 0; }
    .app-summary { color: var(--muted); font-size: 0.92rem; margin-bottom: 4px; }

    .releases { margin-top: 14px; border-left: 2px solid var(--line); padding-left: 16px; display: grid; gap: 16px; min-width: 0; }
    .release { position: relative; min-width: 0; }
    .release::before {
      content: ''; position: absolute; left: -22px; top: 5px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 3px var(--bg-bottom);
    }
    .release.old::before { background: var(--muted); }
    .release-head { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .pill { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; color: var(--muted); background: rgba(45, 47, 47, 0.05); border: 1px solid var(--line); padding: 3px 9px; border-radius: 9999px; }
    .pill.primary { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
    .release-date { margin-left: auto; font-size: 0.82rem; color: var(--muted); }
    .release-meta { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); margin: 8px 0; }
    .release .actions { margin: 10px 0; }

    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty .mark { font-size: 40px; display: block; margin-bottom: 12px; }
    .empty h3 { font-family: var(--display); font-size: 1.25rem; color: var(--ink); margin-bottom: 6px; }

    footer { border-top: 1px solid var(--line); margin-top: 56px; padding-top: 26px; }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: center; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--muted); font-weight: 600; }
    footer .links { display: flex; gap: 18px; }

    @media (max-width: 600px) {
      .code {
        font-size: 0.78rem;
        padding: 12px 42px 12px 12px;
      }
    }

    /* Search Bar styling */
    .search-container {
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      color: var(--muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.95rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .search-input-wrapper input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(252, 216, 70, 0.25);
    }

    /* CLI Command Syntax Highlighting */
    .code-keyword { color: #005cc5; font-weight: 600; }
    .code-subcommand { color: #d73a49; }
    .code-flag { color: #e36209; }
    .code-url { color: #22863a; text-decoration: underline; text-underline-offset: 3px; }

    @media (prefers-color-scheme: dark) {
      .code-keyword { color: #c9d1d9; font-weight: 600; }
      .code-subcommand { color: #ff7b72; }
      .code-flag { color: #79c0ff; }
      .code-url { color: #85e8b4; text-decoration: underline; text-underline-offset: 3px; }
    }

    /* Skeleton Loader Styles */
    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow);
      pointer-events: none;
    }
    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, var(--card-border) 25%, var(--line) 50%, var(--card-border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .skeleton-line.title {
      height: 24px;
      width: 40%;
      margin-bottom: 20px;
    }
    .skeleton-app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .skeleton-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--card-border) 25%, var(--line) 50%, var(--card-border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      flex-shrink: 0;
    }
    .skeleton-app-titles {
      flex-grow: 1;
    }
    .skeleton-app-title {
      height: 18px;
      width: 50%;
      margin-bottom: 8px;
    }
    .skeleton-app-id {
      height: 12px;
      width: 30%;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <span class="brand"><span class="mark" aria-hidden="true">🍋</span> Lemonade</span>
      <span class="spacer"></span>
      <a class="ext" href="https://lemonade-server.ai/" target="_blank" rel="noopener">lemonade-server.ai ↗</a>
    </header>
  </div>

  <main class="wrap">
    <section class="hero">
      <span class="eyebrow"><span class="dot"></span> Flatpak repository</span>
      <h1>Install <span class="hl">Lemonade</span> apps on Linux.</h1>
      <div class="badges" id="hero-badges">
        <span class="badge signed" id="badge-signed" style="display: none;"><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> GPG signed &amp; verified</span>
        <span class="badge">Remote: <code>{{.RemoteName}}</code></span>
        <span class="badge" id="apps-count-badge" style="display: none;"></span>
      </div>
    </section>

    <section id="setup">
      <div class="sec-head">
        <h2>Add this repository</h2>
        <span class="hint" id="setup-hint">one command</span>
      </div>
      <div id="setup-container">
        <!-- Skeleton for setup card -->
        <div class="skeleton-card">
          <div class="skeleton-line" style="width: 50%;"></div>
          <div class="skeleton-line" style="height: 60px; border-radius: 12px; margin-top: 10px;"></div>
          <div class="skeleton-line" style="width: 80%; margin-top: 10px;"></div>
        </div>
      </div>
    </section>

    <section id="apps">
      <div class="sec-head">
        <h2>Apps</h2>
        <span class="hint" id="apps-hint" style="display: none;"></span>
      </div>

      <div class="search-container" id="search-wrapper" style="display: none;">
        <div class="search-input-wrapper">
          <span class="search-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="app-search" placeholder="Search applications by name, ID, or summary..." aria-label="Search applications">
        </div>
      </div>

      <div id="apps-container" class="grid">
        <!-- Skeleton for apps -->
        <div class="skeleton-card">
          <div class="skeleton-app-header">
            <div class="skeleton-icon"></div>
            <div class="skeleton-app-titles">
              <div class="skeleton-line skeleton-app-title"></div>
              <div class="skeleton-line skeleton-app-id"></div>
            </div>
          </div>
          <div class="skeleton-line" style="width: 90%;"></div>
          <div class="skeleton-line" style="width: 70%;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>{{.FooterText}}</span>
      <span class="links">
        <a href="https://github.com/lemonade-sdk/lemonade" target="_blank" rel="noopener">GitHub</a>
        <a href="https://lemonade-server.ai/#getting-started" target="_blank" rel="noopener">Getting started</a>
        <a href="https://lemonade-server.ai/" target="_blank" rel="noopener">Docs</a>
      </span>
    </div>
  </footer>

  <script>
    var remoteName = '{{.RemoteName}}';
    var pagesUrl = '{{.PagesURL}}';

    function copyCmd(btn) {
      var container = btn.closest('.code');
      if (!container || !navigator.clipboard) return;
      var code = container.querySelector('code');
      if (!code) return;
      navigator.clipboard.writeText(code.textContent).then(function () {
        var prev = btn.innerHTML;
        btn.innerHTML = '✓ Copied';
        btn.classList.add('ok');
        setTimeout(function () {
          btn.innerHTML = prev;
          btn.classList.remove('ok');
        }, 1400);
      });
    }

    function fmtSize(bytes) {
      if (!bytes || isNaN(bytes)) return '0 B';
      var bytesNum = parseInt(bytes, 10);
      const unit = 1024;
      if (bytesNum < unit) return bytesNum + ' B';
      var div = unit, exp = 0;
      for (var n = Math.floor(bytesNum / unit); n >= unit; n = Math.floor(n / unit)) {
        div *= unit;
        exp++;
      }
      var units = ['KB', 'MB', 'GB', 'TB'];
      var val = bytesNum / div;
      if (val < 10) {
        return val.toFixed(1) + ' ' + units[exp];
      }
      return val.toFixed(0) + ' ' + units[exp];
    }

    function fmtDate(ts) {
      if (!ts || isNaN(ts)) return '';
      var d = new Date(parseInt(ts, 10) * 1000);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function appMeta(xml) {
      try {
        var parser = new DOMParser();
        var doc = parser.parseFromString(xml, 'application/xml');
        var pick = function (sel) {
          var els = Array.from(doc.querySelectorAll(sel));
          var fallback = els[0] ? els[0].textContent : undefined;
          var noLang = els.find(function (x) { return !x.getAttribute('xml:lang'); });
          return noLang ? noLang.textContent : fallback;
        };
        return { name: pick('component > name'), summary: pick('component > summary') };
      } catch (e) {
        return {};
      }
    }

    // CLI Command Syntax Highlighting
    function esc(s) { return String(s).replace(/[&<>"']/g, function(c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

    function highlightCmd(cmd) {
      var htmlStr = esc(cmd);
      var urls = [];
      htmlStr = htmlStr.replace(/((?:oci\+)?https?:\/\/[^\s\\]+|sigs\/[^\s\\]+)/g, function(match) {
        urls.push(match);
        return '__AETHERPAK_URL_PLACEHOLDER_' + (urls.length - 1) + '__';
      });
      htmlStr = htmlStr.replace(/(^|\s)(--?[a-zA-Z0-9-]+)/g, '$1<span class="code-flag">$2</span>');
      htmlStr = htmlStr.replace(/(^|\s)(flatpak)\b/g, '$1<span class="code-keyword">$2</span>');
      htmlStr = htmlStr.replace(/\b(install|remote-add|remote-modify)\b/g, '<span class="code-subcommand">$1</span>');
      for (var i = 0; i < urls.length; i++) {
        htmlStr = htmlStr.replace('__AETHERPAK_URL_PLACEHOLDER_' + i + '__', '<span class="code-url">' + urls[i] + '</span>');
      }
      return htmlStr;
    }

    function renderSetup(signing) {
      var setupContainer = document.getElementById('setup-container');
      var setupHint = document.getElementById('setup-hint');
      var badgeSigned = document.getElementById('badge-signed');
      
      var isSigned = signing && signing.enabled;
      
      if (isSigned) {
        badgeSigned.style.display = 'inline-flex';
        setupHint.textContent = 'verified · one command';
        
        var publicKeyUrl = signing.publicKey;
        var lookaside = signing.lookaside;
        
        var verifiedCmd = 'flatpak remote-add --user \\\n  ' + remoteName + ' \\\n  ' + pagesUrl + '/' + remoteName + '.flatpakrepo';
        var legacyCmd = 'flatpak remote-add --if-not-exists --user --no-gpg-verify \\\n  ' + remoteName + ' \\\n  oci+' + pagesUrl;
        var modifyCmd = 'flatpak remote-modify --user \\\n  --signature-lookaside=' + pagesUrl + '/' + lookaside + ' \\\n  ' + remoteName;
        
        var html = '<div class="card">' +
          '<div class="step">' +
            '<span class="label"><span class="n">1</span> Add the signed repository (flatpak ≥ 1.17)</span>' +
            '<div class="code"><button class="copy" onclick="copyCmd(this)">Copy</button><code>' + highlightCmd(verifiedCmd) + '</code></div>' +
            '<p class="note">The <code>.flatpakrepo</code> embeds the GPG key, signature lookaside, and automatically turns on <code>gpg-verify</code>.</p>' +
          '</div>' +
          '<div class="step">' +
            '<details style="margin-top: 6px;">' +
              '<summary style="cursor: pointer; color: var(--muted); font-size: 0.85rem; font-weight: 600;">Older flatpak clients (&lt; 1.17) setup instructions</summary>' +
              '<p class="note" style="margin-top: 8px;">Older Flatpak versions cannot read the signature lookaside from the repository file directly. Run these commands to add the repository and configure verification manually:</p>' +
              '<div class="code" style="margin-top: 8px;"><button class="copy" onclick="copyCmd(this)">Copy</button><code>' + highlightCmd(legacyCmd) + '</code></div>' +
              '<div class="code" style="margin-top: 8px;"><button class="copy" onclick="copyCmd(this)">Copy</button><code>' + highlightCmd(modifyCmd) + '</code></div>' +
            '</details>' +
          '</div>' +
          '<div class="step" style="margin-top: 18px;">' +
            '<span class="label"><span class="n">2</span> Install an app</span>' +
            '<p class="note">Pick any app below, or install by ID once the remote is added.</p>' +
          '</div>' +
          '<div class="actions setup-actions">' +
            '<a class="btn primary" href="' + remoteName + '.flatpakrepo" download>Download .flatpakrepo</a>' +
            '<a class="btn ghost" href="index/static" target="_blank" rel="noopener">View OCI index</a>' +
            '<a class="btn ghost" href="' + publicKeyUrl + '" download>Public key</a>' +
          '</div>' +
        '</div>';
        setupContainer.innerHTML = html;
      } else {
        setupHint.textContent = 'one command';
        var legacyCmd = 'flatpak remote-add --if-not-exists --user --no-gpg-verify \\\n  ' + remoteName + ' \\\n  oci+' + pagesUrl;
        
        var html = '<div class="card">' +
          '<div class="step">' +
            '<span class="label"><span class="n">1</span> Add the remote</span>' +
            '<div class="code"><button class="copy" onclick="copyCmd(this)">Copy</button><code>' + highlightCmd(legacyCmd) + '</code></div>' +
            '<p class="note">This repository is unsigned, so the remote is added without GPG verification.</p>' +
          '</div>' +
          '<div class="actions setup-actions">' +
            '<a class="btn primary" href="' + remoteName + '.flatpakrepo" download>Download .flatpakrepo</a>' +
            '<a class="btn ghost" href="index/static" target="_blank" rel="noopener">View OCI index</a>' +
          '</div>' +
        '</div>';
        setupContainer.innerHTML = html;
      }
    }

    function renderApps(data) {
      var appsContainer = document.getElementById('apps-container');
      var appsHint = document.getElementById('apps-hint');
      var appsCountBadge = document.getElementById('apps-count-badge');
      var searchWrapper = document.getElementById('search-wrapper');

      var results = data.Results || [];
      var apps = {};

      results.forEach(function (res) {
        (res.Images || []).forEach(function (img) {
          var L = img.Labels || {};
          var ref = L['org.flatpak.ref'];
          if (!ref || !L['org.flatpak.metadata']) return;

          var parts = ref.split('/');
          if (parts.length < 4) return;

          var id = parts[1];
          var arch = parts[2];
          var branch = parts[3];

          var ts = 0;
          if (L['org.flatpak.timestamp']) {
            ts = parseInt(L['org.flatpak.timestamp'], 10);
          }
          var isize = 0;
          if (L['org.flatpak.installed-size']) {
            isize = parseInt(L['org.flatpak.installed-size'], 10);
          }
          var dsize = 0;
          if (L['org.flatpak.download-size']) {
            dsize = parseInt(L['org.flatpak.download-size'], 10);
          }
          var commit = L['org.flatpak.commit'] || '';

          var a = apps[id];
          if (!a) {
            var meta = appMeta(L['org.freedesktop.appstream.appdata'] || '');
            var name = meta.name || id.split('.').pop();
            var summary = meta.summary || '';
            var icon = L['org.freedesktop.appstream.icon-64'] || '';

            a = apps[id] = {
              id: id,
              name: name,
              summary: summary,
              icon: icon,
              branches: {}
            };
          } else {
            // Backfill metadata if a subsequent image has richer information
            if (a.name === id || a.summary === '') {
              var meta = appMeta(L['org.freedesktop.appstream.appdata'] || '');
              if (meta.name && meta.name !== id) {
                a.name = meta.name;
                a.summary = meta.summary || '';
              }
            }
            if (!a.icon) {
              a.icon = L['org.freedesktop.appstream.icon-64'] || '';
            }
          }

          var b = a.branches[branch];
          if (!b) {
            b = a.branches[branch] = {
              branch: branch,
              arches: new Set(),
              timestamp: ts,
              installedSize: isize,
              downloadSize: dsize,
              commit: commit
            };
          }
          b.arches.add(arch);
          if (ts > b.timestamp) {
            b.timestamp = ts;
            b.installedSize = isize;
            b.downloadSize = dsize;
            b.commit = commit;
          }
        });
      });

      var ids = Object.keys(apps).sort();

      // Show search bar only if there is more than 1 application
      if (ids.length > 1) {
        searchWrapper.style.display = 'block';
        setupSearch();
      } else {
        searchWrapper.style.display = 'none';
      }

      if (ids.length === 0) {
        appsHint.style.display = 'none';
        appsCountBadge.style.display = 'none';
        appsContainer.innerHTML = '<div class="card empty">' +
          '<span class="mark" aria-hidden="true">🍋</span>' +
          '<h3>No apps published yet</h3>' +
          '<p>Once a build is published to this repository, its apps appear here automatically.</p>' +
        '</div>';
        return;
      }

      // Update badges & hints
      appsCountBadge.textContent = ids.length + ' app' + (ids.length > 1 ? 's' : '');
      appsCountBadge.style.display = 'inline-flex';
      appsHint.textContent = ids.length + ' app' + (ids.length > 1 ? 's' : '') + ' · install per release';
      appsHint.style.display = 'inline';

      var cardsHTML = '';

      ids.forEach(function (id) {
        var app = apps[id];
        
        var iconHTML = '🍋';
        if (app.icon) {
          iconHTML = '<img src="' + esc(app.icon) + '" alt="" style="width: 100%; height: 100%; object-fit: contain;">';
        }

        var summaryHTML = '';
        if (app.summary) {
          summaryHTML = '<p class="app-summary">' + esc(app.summary) + '</p>';
        }

        var sortedBranches = Object.values(app.branches).sort(function (a, b) {
          return b.timestamp - a.timestamp;
        });

        var releasesHTML = '';
        sortedBranches.forEach(function (b, index) {
          var isLatest = index === 0;
          var releaseClass = isLatest ? '' : 'old';
          
          var archesArray = Array.from(b.arches).sort();
          var archesHTML = '';
          archesArray.forEach(function (a) {
            archesHTML += '<span class="pill">' + esc(a) + '</span>';
          });

          var dateStr = fmtDate(b.timestamp);
          var dateHTML = '';
          if (isLatest) {
            dateHTML += 'latest';
            if (dateStr) dateHTML += ' · ';
          }
          if (dateStr) {
            dateHTML += 'released ' + dateStr;
          }

          var sizeMeta = fmtSize(b.installedSize) + ' installed · ' + fmtSize(b.downloadSize) + ' download';
          if (b.commit) {
            sizeMeta += ' · ' + esc(b.commit.slice(0, 10));
          }

          var refFile = 'refs/' + app.id + '-' + b.branch.replace(/\//g, '-') + '.flatpakref';
          var installCmd = 'flatpak install --user ' + remoteName + ' ' + app.id + '//' + b.branch;

          releasesHTML += '<div class="release ' + releaseClass + '">' +
            '<div class="release-head">' +
              '<span class="pill primary">' + esc(b.branch) + '</span>' +
              archesHTML +
              '<span class="release-date">' + dateHTML + '</span>' +
            '</div>' +
            '<div class="release-meta">' + sizeMeta + '</div>' +
            '<div class="actions">' +
              '<a class="btn primary" href="' + esc(refFile) + '" download>Install (' + esc(b.branch) + ')</a>' +
            '</div>' +
            '<div class="code"><button class="copy" onclick="copyCmd(this)">Copy</button><code>' + highlightCmd(installCmd) + '</code></div>' +
          '</div>';
        });

        cardsHTML += '<article class="card app-card" data-app-id="' + esc(app.id) + '" data-app-name="' + esc(app.name) + '" data-app-summary="' + esc(app.summary) + '">' +
          '<div class="app-head">' +
            '<span class="app-icon" role="img" aria-label="' + esc(app.name) + ' icon">' + iconHTML + '</span>' +
            '<div>' +
              '<div class="app-name">' + esc(app.name) + '</div>' +
              '<div class="app-id">' + esc(app.id) + '</div>' +
            '</div>' +
          '</div>' +
          summaryHTML +
          '<div class="releases">' +
            releasesHTML +
          '</div>' +
        '</article>';
      });

      appsContainer.innerHTML = cardsHTML;
    }

    function setupSearch() {
      var searchInput = document.getElementById('app-search');
      if (!searchInput) return;

      searchInput.addEventListener('input', function (e) {
        var query = e.target.value.toLowerCase().trim();
        var cards = document.querySelectorAll('#apps-container > .app-card');
        var visibleCount = 0;

        cards.forEach(function (card) {
          var name = card.getAttribute('data-app-name').toLowerCase();
          var id = card.getAttribute('data-app-id').toLowerCase();
          var summary = (card.getAttribute('data-app-summary') || '').toLowerCase();

          if (name.indexOf(query) !== -1 || id.indexOf(query) !== -1 || summary.indexOf(query) !== -1) {
            card.style.display = 'block';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        var emptySearch = document.getElementById('empty-search');
        if (visibleCount === 0) {
          if (!emptySearch) {
            emptySearch = document.createElement('div');
            emptySearch.id = 'empty-search';
            emptySearch.className = 'card empty';
            emptySearch.style.marginTop = '1.5rem';
            emptySearch.innerHTML = '<span class="mark" aria-hidden="true">🍋</span><h3>No matching applications</h3><p>Try searching for a different keyword or app ID.</p>';
            document.getElementById('apps-container').appendChild(emptySearch);
          }
        } else {
          if (emptySearch) emptySearch.remove();
        }
      });

      // Focus search input when "/" is pressed
      document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          searchInput.focus();
        }
      });
    }

    Promise.all([
      fetch('sigs/signing.json').then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }),
      fetch('index/static').then(function(r) { if (!r.ok) throw new Error('load'); return r.json(); })
    ]).then(function(results) {
      var signing = results[0];
      var data = results[1];
      
      renderSetup(signing);
      renderApps(data);
    }).catch(function(err) {
      console.error(err);
      var appsContainer = document.getElementById('apps-container');
      var searchWrapper = document.getElementById('search-wrapper');
      if (searchWrapper) searchWrapper.style.display = 'none';
      if (appsContainer) {
        appsContainer.innerHTML = '<div class="card empty" style="border-color:#ef4444;color:#f87171;">' +
          '<h3>Failed to load repository</h3>' +
          '<p>Ensure index/static exists and is accessible.</p>' +
        '</div>';
      }
    });
  </script>
</body>
</html>
